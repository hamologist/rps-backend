root = "."
tmp_dir = "tmp"

[build]
  cmd = "go build -o ./tmp/rps-backend ./cmd/rps-backend"
  bin = "./tmp/rps-backend"
  include_ext = ["go", "sql"]
  exclude_dir = ["tmp", "docker", ".git", ".claude"]
  exclude_regex = ["_test\\.go$"]
  delay = 500
  kill_delay = "2s"
  send_interrupt = true
  stop_on_error = true

[log]
  time = true

[misc]
  clean_on_exit = true
