# Production: docker compose -f docker/deploy/compose.yaml up -d --build
services:
  rps-backend:
    build:
      context: ../..
      dockerfile: docker/deploy/Dockerfile
    image: rps-backend:latest
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - rps-data:/data
    environment:
      RPS_ALLOWED_ORIGINS: ${RPS_ALLOWED_ORIGINS:-}
    healthcheck:
      test: ["CMD", "/rps-backend", "healthcheck"]
      interval: 30s
      timeout: 5s
      start_period: 5s
      retries: 3

volumes:
  rps-data:
